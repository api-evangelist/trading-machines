description: Trading Machines LLC is a proprietary high-frequency options and equities trading firm,
  founded around 2007 and headquartered in New York City, and registered as a broker-dealer with FINRA
  (CRD 146274). The firm traded on its own account, at one point reportedly executing a meaningful share
  of daily US options volume using low-latency, algorithmic and automated trading technology. As a
  proprietary trading firm it operates for its own book rather than offering a public developer product,
  and it surfaced in the API Evangelist network only as a Battery Ventures portfolio lead. Research
  during enrichment found no public API, developer portal, OpenAPI/AsyncAPI specification, SDKs, or other
  machine-readable developer surface to catalog.
